name: PAE-04 CP39R-R11B synthetic upgrade rollback one-shot
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/pae04-cp39r-r11b-upgrade-once.yml'
permissions:
  contents: read
concurrency:
  group: pae04-r11b-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  synthetic_upgrade:
    if: >-
      github.repository == 'mastyukov/health-tracker' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.head.ref == 'sandbox/pae04-cp39r-r11b-live-compatible-20261122' &&
      github.event.pull_request.head.repo.full_name == 'mastyukov/health-tracker' &&
      github.event.pull_request.base.sha == '068bfc4f4bd39736a59c12bd37c56b647bd885cb' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      NODE_OPTIONS: '--max-old-space-size=768'
    steps:
      - name: Checkout pinned QA head without token persistence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Exact source and release verification
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'mastyukov/health-tracker'
          test "$GITHUB_EVENT_NAME" = 'pull_request'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD^)" = '068bfc4f4bd39736a59c12bd37c56b647bd885cb'
          test "$(node --version | cut -d. -f1)" = 'v26'
          command -v google-chrome
          python3 qa/ui-v23/verify_personal_v23.py site
          node --check qa/cp39r-r11b/upgrade_once.cjs
          node --check site/app.js
          node --check site/sw.js
          node --check site/offline_status.js
          echo R11B_STATIC_GATE_PASS
      - name: Install pinned Playwright-core in runner temporary storage only
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pae04-r11b-deps" --no-save --no-audit --no-fund --ignore-scripts --no-package-lock playwright-core@1.65.1
      - name: One browser upgrade offline and rollback test using fictional records
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/pae04-r11b-deps/node_modules
        run: |
          set -euo pipefail
          node qa/cp39r-r11b/upgrade_once.cjs
          echo R11B_ONE_SHOT_COMPLETE
