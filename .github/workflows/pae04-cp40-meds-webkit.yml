name: PAE-04 CP40 Medicines R3 WebKit only — synthetic iPhone QA
on:
  push:
    branches:
      - sandbox/pae04-approved-ux23-iphone-cp40-20261123-r1
    paths:
      - qa/cp40/meds_webkit_smoke.py
      - .github/workflows/pae04-cp40-meds-webkit.yml

permissions:
  contents: read

concurrency:
  group: pae04-cp40-meds-webkit-only
  cancel-in-progress: false

jobs:
  webkit-iphone:
    if: github.repository == 'mastyukov/health-tracker' && github.ref == 'refs/heads/sandbox/pae04-approved-ux23-iphone-cp40-20261123-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.1-noble
    env:
      PAE04_SYNTHETIC_ONLY: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout only sandbox, no production credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Playwright Python 1.65.1 matches preinstalled WebKit engine
        run: python -m pip install --quiet --disable-pip-version-check 'playwright==1.65.1'
      - name: READ-ONLY preflight and syntax
        run: |
          set -eu
          test "$PAE04_SYNTHETIC_ONLY" = "true"
          test "$GITHUB_REF" = "refs/heads/sandbox/pae04-approved-ux23-iphone-cp40-20261123-r1"
          python -m py_compile qa/cp40/meds_webkit_smoke.py
          python -m playwright --version
      - name: Targeted Linux WebKit synthetic iPhone UX, never Safari certification
        run: python qa/cp40/meds_webkit_smoke.py
      - name: Retain evidence for 3 days, no deploy or medical data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-cp40-meds-webkit-r1-synthetic-evidence
          path: qa/cp40/meds_webkit_r1_results/*
          if-no-files-found: warn
          retention-days: 3
