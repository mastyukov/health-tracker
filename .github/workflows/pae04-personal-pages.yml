name: PAE-04 PERSONAL iPhone UX v2.3 verified Pages deployment
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pae04-personal-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pae04-personal-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'mastyukov/health-tracker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 22 pinned assets and no unapproved data migration
        run: python qa/ui-v23/verify_personal_v23.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
