name: PAE-04 PERSONAL Health Tracker deploy verified site to Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pae04-personal-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pae04-personal-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'mastyukov/health-tracker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse unexpected app bytes before deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          python qa/rc1/verify_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
