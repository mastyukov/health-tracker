name: PAE-04 CP40 Backup WebKit-R1 — synthetic export/checkpoint/import
on:
  push:
    branches:
      - sandbox/pae04-approved-ux23-iphone-cp40-20261123-r1
    paths:
      - qa/cp40/meds_backup_webkit.py
      - .github/workflows/pae04-cp40-backup-webkit.yml
permissions:
  contents: read
concurrency:
  group: pae04-cp40-backup-webkit-only
  cancel-in-progress: false
jobs:
  webkit-backup:
    if: github.repository == 'mastyukov/health-tracker' && github.ref == 'refs/heads/sandbox/pae04-approved-ux23-iphone-cp40-20261123-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.1-noble
    env:
      PAE04_SYNTHETIC_ONLY: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout sandbox without persist credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Playwright Python with preinstalled WebKit
        run: python -m pip install --quiet --disable-pip-version-check 'playwright==1.65.1'
      - name: Guard sandbox source and syntax
        run: |
          set -eu
          test "$PAE04_SYNTHETIC_ONLY" = "true"
          test "$GITHUB_REF" = "refs/heads/sandbox/pae04-approved-ux23-iphone-cp40-20261123-r1"
          python -m py_compile qa/cp40/meds_backup_webkit.py
      - name: One targeted real WebKit backup, checkpoint and restore smoke
        run: python qa/cp40/meds_backup_webkit.py
      - name: Retain JSON report and synthetic screenshot only, never raw backup files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-cp40-backup-webkit-r1-synthetic-evidence
          path: qa/cp40/backup_webkit_r1_results/*
          if-no-files-found: warn
          retention-days: 3
