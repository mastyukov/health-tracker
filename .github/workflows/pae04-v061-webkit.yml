name: PAE-04 PERSONAL v0.6.1 Apple Light Comfort / Safari WebKit QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'qa/ui-v061/**'
      - '.github/workflows/pae04-v061-webkit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    if: github.repository == 'mastyukov/health-tracker' && github.event_name == 'pull_request' && github.head_ref == 'sandbox/pae04-personal-apple-light-v061'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PAE04_SYNTHETIC_ONLY: 'true'
      SOURCE_SHA: '39be9bea9b23098034f31506ed8418e3aed96056'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pinned modern runtimes and source integrity
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys; assert sys.version_info[:2]==(3,12)"
          node -e "if(process.versions.node.split('.')[0]!=='26')process.exit(2)"
          test -f site/index.html
          test -f site/sw.js
          test -f site/personal_profile.json
          test -f qa/ui-v061/verify_ui.py
          python qa/ui-v061/verify_ui.py site
          node --check site/app.js
          node --check site/home.js
          node --check site/sw.js
          node --check site/personal_adapter.js
          python -m py_compile qa/ui-v061/browser_qa.py
      - name: Fetch immutable regression QA from audited TEST repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/pae04-original-qa"
          git -C "$RUNNER_TEMP/pae04-original-qa" remote add origin https://github.com/mastyukov-cyber/pae04-health-tracker-test.git
          git -C "$RUNNER_TEMP/pae04-original-qa" fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C "$RUNNER_TEMP/pae04-original-qa" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pae04-original-qa" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Pin Playwright exactly 1.65.1 and install WebKit only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.65.1'
          python -m playwright install --with-deps webkit
          python -c "from importlib.metadata import version; assert version('playwright')=='1.65.1'"
      - name: Original full WebKit regression (188 independent checks)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pae04-original-qa"
          python qa/runtime-migration-pilot/run_suite.py webkit RELEASE
      - name: New iPhone design, 320px, SHA backup and offline synthetic QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pae04-ui-v061"
          python qa/ui-v061/browser_qa.py webkit "$PWD/site" "$RUNNER_TEMP/pae04-ui-v061" | tee "$RUNNER_TEMP/pae04-ui-v061/qa.log"
          grep -q 'RESULT=PASS WEBKIT_PAE04_PERSONAL_V061 ' "$RUNNER_TEMP/pae04-ui-v061/qa.log"
          echo 'PAE04_APPLE_LIGHT_COMFORT_WEBKIT=PASS'
      - name: Preserve only disposable fictional QA screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-v061-webkit-synthetic-ui
          path: ${{ runner.temp }}/pae04-ui-v061/
          retention-days: 14
          if-no-files-found: warn
